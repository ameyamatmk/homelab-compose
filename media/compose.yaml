services:
  # --- 音楽サーバー ---
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - TZ=Asia/Tokyo
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=720h
      - ND_BASEURL=
      # Last.fm 連携（任意）
      - ND_LASTFM_APIKEY=${LASTFM_API_KEY:-}
      - ND_LASTFM_SECRET=${LASTFM_SECRET:-}
      # Spotify アーティスト画像取得用（任意）
      - ND_SPOTIFY_ID=${SPOTIFY_ID:-}
      - ND_SPOTIFY_SECRET=${SPOTIFY_SECRET:-}
    volumes:
      - /opt/homelab/volumes/navidrome/data:/data
      - /mnt/nas/music:/music:ro
    networks:
      - homelab-net

  # --- 写真・動画管理サーバー ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      - TZ=Asia/Tokyo
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - /opt/homelab/volumes/immich/upload:/usr/src/app/upload
      - /mnt/nas/photos:/mnt/nas/photos:ro
    depends_on:
      - immich-postgres
      - immich-redis
    networks:
      - homelab-net
      - immich-internal

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - /opt/homelab/volumes/immich/model-cache:/cache
    networks:
      - immich-internal

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
      # SSD以外にDBを置く場合はコメントを外す
      # - DB_STORAGE_TYPE=HDD
    volumes:
      - /opt/homelab/volumes/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich-internal

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich-internal

networks:
  homelab-net:
    external: true
  immich-internal:
    driver: bridge