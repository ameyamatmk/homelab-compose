services:
  money-forward-viewer:
    image: ghcr.io/ameyamatmk/moneyforwardviewer:latest
    container_name: money-forward-viewer
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - /opt/homelab/volumes/money-forward-viewer/data:/app/data
    networks:
      - homelab-net

  annict-viewer:
    image: ghcr.io/ameyamatmk/annictviewer:main
    container_name: annict-viewer
    restart: unless-stopped
    environment:
      - TZ=Asia/Tokyo
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - ANNICT_CLIENT_ID=${ANNICT_CLIENT_ID}
      - ANNICT_CLIENT_SECRET=${ANNICT_CLIENT_SECRET}
      - ANNICT_ACCESS_TOKEN=${ANNICT_ACCESS_TOKEN}
      - DATABASE_URL=file:/app/data/sqlite.db
    volumes:
      - /opt/homelab/volumes/annict-viewer/data:/app/data
      - /opt/homelab/volumes/annict-viewer/images:/app/public/images/works
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homelab-net

  voitra:
    image: ghcr.io/ameyamatmk/voitra:latest
    container_name: voitra
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Tokyo
      - VOITRA_API_KEY=${VOITRA_API_KEY}
      - VOITRA_DB_PATH=/data/voitra.db
    volumes:
      - /opt/homelab/volumes/voitra/data:/data
    healthcheck:
      # distroless にシェル/wget/curl が無いため、バイナリの self-check モードを使う
      test: ["CMD", "/voitra", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true